<section id="home" class="bg-[#050814] pt-24 text-white">
  <div class="flex w-full flex-col items-center gap-12 px-6 py-16 lg:flex-row lg:items-start lg:gap-16 lg:px-10">
    <!-- Text column -->
    <div class="w-full lg:w-5/12">
      <span class="inline-flex rounded-full bg-violet-500/10 px-4 py-2 text-sm font-semibold tracking-wide text-violet-300">
        Angular Developer
      </span>

      <h1 class="mt-6 text-4xl font-bold tracking-tight text-white sm:text-5xl">
        Hi, I&apos;m <span class="text-violet-400">EC Maceda</span>
      </h1>

      <p class="mt-6 max-w-2xl text-base leading-8 text-slate-300 sm:text-lg">
        I build clean, modern web apps with Angular and TypeScript. I focus on
        responsive design, engaging UI, and scalable frontend experiences for
        startups and businesses.
      </p>

      <div class="mt-10 flex flex-col gap-4 sm:flex-row sm:items-center">
        <a
          href="#projects"
          class="inline-flex items-center justify-center rounded-full bg-violet-500 px-6 py-3 text-sm font-semibold text-white transition hover:bg-violet-400"
        >
          View My Work
        </a>

        <a
          href="#contact"
          class="inline-flex items-center justify-center gap-2 rounded-full border border-white/10 bg-white/5 px-6 py-3 text-sm font-semibold text-white transition hover:border-violet-400 hover:bg-violet-500/10"
        >
          Contact Me
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <div class="mt-10 flex flex-row gap-4">
        <a
          href="https://github.com/Macedman"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub profile"
          class="rounded-xl border border-white/10 bg-white/5 p-2.5 text-slate-300 transition hover:border-violet-500/40 hover:bg-violet-500/10 hover:text-violet-400"
        >
          <lucide-angular [img]="github" class="h-5 w-5 text-white" />
        </a>

        <a
          href="https://www.linkedin.com/in/eugene-clint-maceda-056535221/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn profile"
          class="rounded-xl border border-white/10 bg-white/5 p-2.5 text-slate-300 transition hover:border-violet-500/40 hover:bg-violet-500/10 hover:text-violet-400"
        >
          <lucide-angular [img]="linkedIn" class="h-5 w-5 text-white" />
        </a>

        <button
          type="button"
          (click)="copyEmail()"
          aria-label="Copy email address"
          class="rounded-xl border border-white/10 bg-white/5 p-2.5 text-slate-300 transition hover:border-violet-500/40 hover:bg-violet-500/10 hover:text-violet-400"
        >
          <lucide-angular [img]="email" class="h-5 w-5 text-white" />
        </button>
      </div>
    </div>

    <!-- Image column -->
    <div class="w-full lg:w-7/12">
      <div class="hero-image-wrap relative flex w-full items-center justify-center py-6 lg:justify-end lg:py-0">
        <div class="hero-glow pointer-events-none absolute inset-0" aria-hidden="true">
          <div class="hero-glow__orb hero-glow__orb--violet"></div>
          <div class="hero-glow__orb hero-glow__orb--indigo"></div>
          <div class="hero-glow__orb hero-glow__orb--blue"></div>
          <div class="hero-glow__orb hero-glow__orb--fuchsia"></div>
        </div>
        <img
          src="/hero-image.png"
          alt="Coding workspace"
          class="relative z-10 block w-full max-w-none object-contain lg:scale-100 drop-shadow-[0_24px_48px_rgba(0,0,0,0.45)]"
        />
      </div>
    </div>
  </div>
</section>
