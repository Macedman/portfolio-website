<nav
  class="fixed top-0 left-0 z-50 w-full border-b border-white/10 bg-[#070B14]/80 backdrop-blur-xl"
>
  <div class="flex h-20 w-full items-center justify-between px-6 lg:px-10">
    <a
      href="#home"
      class="group flex items-center gap-3 transition-all duration-300"
      (click)="closeMenu()"
    >
      <div
        class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-500 to-violet-300 shadow-lg shadow-violet-500/20 transition-all duration-300 group-hover:scale-105"
      >
        <span class="">
          <img
          src="/Logo-no-bg.png"
          alt="EC logo"
          class=""
        />
        </span>
      </div>

      <div class="hidden sm:block">
        <span class="text-sm font-semibold tracking-wide text-white">EC Maceda</span>
      </div>
    </a>

    <div class="hidden items-center gap-8 md:flex">
      @for (link of navLinks; track link.href) {
        <a
          [href]="link.href"
          class="text-sm font-medium text-slate-300 transition hover:text-violet-400"
        >
          {{ link.label }}
        </a>
      }
    </div>

    <div class="flex items-center gap-3 sm:gap-4">
      <a
        href="/Eugene Clint Maceda - Angular Developer.pdf"
        download="Eugene Clint Maceda - Angular Developer.pdf"
        class="hidden items-center gap-2 rounded-xl bg-gradient-to-r from-violet-500 to-blue-500 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-violet-500/20 transition-all duration-300 hover:scale-105 hover:shadow-violet-500/40 sm:inline-flex lg:px-5"
      >
        <span class="hidden lg:inline">Download CV</span>
        <span class="lg:hidden">CV</span>
        <lucide-angular [img]="download" class="h-5 w-5 text-white" />
      </a>

      <button
        type="button"
        class="flex h-11 w-11 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-slate-300 transition hover:bg-white/10 md:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()"
      >
        <lucide-angular
          [img]="menuOpen() ? X : Menu"
          class="h-5 w-5 text-white"
        />
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div
      id="mobile-nav"
      class="border-t border-white/10 bg-[#070B14]/95 px-6 py-4 backdrop-blur-xl md:hidden"
    >
      <div class="flex flex-col gap-1">
        @for (link of navLinks; track link.href) {
          <a
            [href]="link.href"
            class="rounded-lg px-3 py-3 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-violet-400"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }
        <a
          href="/Eugene Clint Maceda - Angular Developer.pdf"
          download="Eugene Clint Maceda - Angular Developer.pdf"
          class="mt-2 inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-violet-500 to-blue-500 px-5 py-3 text-sm font-semibold text-white"
          (click)="closeMenu()"
        >
          Download CV
          <lucide-angular [img]="download" class="h-5 w-5 text-white" />
        </a>
      </div>
    </div>
  }
</nav>
