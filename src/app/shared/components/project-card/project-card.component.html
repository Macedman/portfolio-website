<div class="flex h-full flex-col border border-white/10 bg-[#070B14]/80 p-3">
  <div class="aspect-video w-full overflow-hidden rounded-[1rem] sm:aspect-[4/3]">
    <img
      [src]="project.image"
      [alt]="project.name"
      class="block h-full w-full object-cover"
      loading="lazy"
    />
  </div>
  <h3 class="mt-3 line-clamp-2 text-lg font-bold leading-snug">{{ project.name }}</h3>
  <p class="mt-2 line-clamp-4 flex-1 text-sm leading-relaxed text-slate-300">{{ project.description }}</p>
  <div class="mt-2 flex flex-wrap gap-2">
    @for (tech of project.techStack; track tech) {
      <div class="border border-white/10 px-2 py-1 text-sm">{{ tech }}</div>
    }
  </div>
  <div class="mt-4 flex flex-wrap gap-3">
    @if (project.github) {
      <a
        [href]="project.github"
        target="_blank"
        rel="noopener noreferrer"
        class="text-sm font-medium text-violet-400 transition hover:text-violet-300"
      >
        GitHub
      </a>
    }
    @if (project.liveDemo && project.liveDemo !== 'Coming Soon') {
      <a
        [href]="project.liveDemo"
        target="_blank"
        rel="noopener noreferrer"
        class="text-sm font-medium text-violet-400 transition hover:text-violet-300"
      >
        Live demo
      </a>
    } @else if (project.liveDemo) {
      <span class="text-sm text-slate-500">{{ project.liveDemo }}</span>
    }
  </div>
</div>
